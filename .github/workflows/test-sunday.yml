name: Test - LMU Philo group room Sun 15 Nov

# One-off test: at Sun 8 Nov 00:00 (Berlin) the slots for Sun 15 Nov open.
# Starts Sat 7 Nov 23:30 CET (22:30 UTC), waits for midnight and books ONE
# Philologicum group room (longest window first). Delete after the test.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 7 11 *'

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Book one Philologicum group room for Sun 15 Nov
        env:
          USERNAME: ${{ secrets.LMU_USERNAME }}
          PASSWORD: ${{ secrets.LMU_PASSWORD }}
          SSO_PROVIDER: lmu
          ACCEPT_AGREEMENTS: lmu-ub
          FLOORS: philologicum
          BOOK_DAYS_AHEAD: '7'
          BOOK_WEEKDAYS: sun
          BOOK_UNTIL: '2026-11-15'
          MAX_BOOKINGS: '1'
          SNIPE_ACTIVATE_MIN: '45'
          SNIPE_WINDOW_S: '30'
          USE_ANNY_FAVORITES: 'False'
          BOOKING_TIMES: >-
            13:00:00-17:00:00, 10:00:00-14:00:00, 14:00:00-18:00:00,
            17:00:00-21:00:00, 18:00:00-22:00:00, 09:00:00-13:00:00,
            12:00:00-14:00:00, 15:00:00-17:00:00, 10:00:00-12:00:00,
            17:00:00-19:00:00, 19:00:00-21:00:00, 11:00:00-12:00:00,
            16:00:00-17:00:00, 20:00:00-21:00:00
        run: python main.py
