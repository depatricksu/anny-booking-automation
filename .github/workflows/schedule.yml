name: Library Reservation

# Triggered externally at a precise time (e.g. via cron-job.org calling the
# workflow_dispatch API), because GitHub's built-in `schedule:` cron can be
# delayed by 10-15 min — which matters for hitting the exact opening time.
on:
  workflow_dispatch:
  # Nightly run for LMU's 00:00 (Europe/Berlin) release. GitHub cron is UTC and
  # may start 10-15 min late, so start ~23:30 Berlin and let the job wait for
  # midnight (LMU_SNIPE_ACTIVATE_MIN=45). Two entries cover CET and CEST; the
  # one that is not ~30 min before midnight exits immediately.
  schedule:
    # Thursday nights only: Friday 00:00 releases the Friday one week later
    # (LMU_BOOK_WEEKDAYS=fri). Use '* * *' instead of '* * 4' for every night.
    - cron: '30 22 * * 4'   # Thu 23:30 CET (winter)
    - cron: '30 21 * * 4'   # Thu 23:30 CEST (summer)

jobs:
  book:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per account. Each uses secrets <UNI>_USERNAME / <UNI>_PASSWORD
        # and optional variables <UNI>_FLOORS, <UNI>_BOOK_DAYS_AHEAD, ...
        # (falling back to the unprefixed variable). A job whose username
        # secret is missing is skipped.
        uni: [LMU, TUM]
    env:
      HAS_ACCOUNT: ${{ secrets[format('{0}_USERNAME', matrix.uni)] != '' }}
    steps:
      - if: env.HAS_ACCOUNT != 'true'
        run: echo "No ${{ matrix.uni }}_USERNAME secret - skipping ${{ matrix.uni }}"
      - if: env.HAS_ACCOUNT == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_ACCOUNT == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - if: env.HAS_ACCOUNT == 'true'
        name: Install dependencies
        run: pip install -r requirements.txt
      - if: env.HAS_ACCOUNT == 'true'
        name: Run booking (${{ matrix.uni }})
        env:
          USERNAME: ${{ secrets[format('{0}_USERNAME', matrix.uni)] }}
          PASSWORD: ${{ secrets[format('{0}_PASSWORD', matrix.uni)] }}
          SSO_PROVIDER: ${{ vars[format('{0}_SSO_PROVIDER', matrix.uni)] || matrix.uni }}
          BOOKING_MODE: ${{ vars[format('{0}_BOOKING_MODE', matrix.uni)] || vars.BOOKING_MODE }}
          BOOK_DAYS_AHEAD: ${{ vars[format('{0}_BOOK_DAYS_AHEAD', matrix.uni)] || vars.BOOK_DAYS_AHEAD }}
          BOOKING_TIMES: ${{ vars[format('{0}_BOOKING_TIMES', matrix.uni)] || vars.BOOKING_TIMES }}
          FLOORS: ${{ vars[format('{0}_FLOORS', matrix.uni)] || vars.FLOORS }}
          PREFERRED_RESOURCES: ${{ vars[format('{0}_PREFERRED_RESOURCES', matrix.uni)] || vars.PREFERRED_RESOURCES }}
          USE_ANNY_FAVORITES: ${{ vars[format('{0}_USE_ANNY_FAVORITES', matrix.uni)] || vars.USE_ANNY_FAVORITES }}
          BOOK_WEEKDAYS: ${{ vars[format('{0}_BOOK_WEEKDAYS', matrix.uni)] || vars.BOOK_WEEKDAYS }}
          ACCEPT_AGREEMENTS: ${{ vars[format('{0}_ACCEPT_AGREEMENTS', matrix.uni)] || vars.ACCEPT_AGREEMENTS }}
          SNIPE_ACTIVATE_MIN: ${{ vars[format('{0}_SNIPE_ACTIVATE_MIN', matrix.uni)] || vars.SNIPE_ACTIVATE_MIN }}
        run: python main.py
