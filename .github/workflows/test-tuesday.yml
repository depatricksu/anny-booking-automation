name: Test - LMU Philo group room Tue 17 Nov

# One-off test: at Tue 10 Nov 00:00 (Berlin) the slots for Tue 17 Nov open.
# Starts Mon 9 Nov 22:00 CET (21:00 UTC), waits for midnight and books ONE
# Philologicum group room (longest window first). A backup start at 23:00 CET
# covers GitHub's late starts; the concurrency group runs them one after the
# other, so a run that starts after the opening just exits. Delete after the test.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 9 11 *'   # Mon 9 Nov 22:00 CET
    - cron: '0 22 9 11 *'   # backup, 23:00 CET

concurrency:
  group: lmu-booking-test
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Book one Philologicum group room for Tue 17 Nov
        env:
          USERNAME: ${{ secrets.LMU_USERNAME }}
          PASSWORD: ${{ secrets.LMU_PASSWORD }}
          SSO_PROVIDER: lmu
          ACCEPT_AGREEMENTS: lmu-ub
          FLOORS: philologicum
          BOOK_DAYS_AHEAD: '7'
          BOOK_WEEKDAYS: tue
          BOOK_UNTIL: '2026-11-17'
          MAX_BOOKINGS: '1'
          SNIPE_ACTIVATE_MIN: '150'
          SNIPE_WINDOW_S: '30'
          USE_ANNY_FAVORITES: 'False'
          BOOKING_TIMES: >-
            13:00:00-17:00:00, 10:00:00-14:00:00, 14:00:00-18:00:00,
            17:00:00-21:00:00, 18:00:00-22:00:00, 09:00:00-13:00:00,
            12:00:00-14:00:00, 15:00:00-17:00:00, 10:00:00-12:00:00,
            17:00:00-19:00:00, 19:00:00-21:00:00, 11:00:00-12:00:00,
            16:00:00-17:00:00, 20:00:00-21:00:00
        run: python main.py
